# Chạy pipeline open data mỗi tuần, commit data mới (nếu có) và publish public/ lên GitHub Pages.
name: Build data packs

on:
  schedule:
    - cron: "17 3 * * 1"   # thứ Hai 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Test đỏ → dừng ở đây, không publish.
      - name: Unit tests
        run: python -m unittest -v

      # Một nguồn lỗi không làm đỏ bước này: build_packs.py giữ camera cũ của nguồn đó và ghi lý do vào REPORT.md.
      # Key API lấy từ repo secrets; secret chưa đặt → biến rỗng → nguồn đó "skipped: no key", vẫn xanh.
      - name: Build packs
        env:
          TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # NYC Geoclient (D04): thiếu secret → chỉ dùng cache/nyc_geocode.json, địa điểm mới chưa geocode được.
          NYC_GEOCLIENT_KEY: ${{ secrets.NYC_GEOCLIENT_KEY }}
        run: python build_packs.py

      - name: Commit data changes
        run: |
          if [ -z "$(git status --porcelain -- public manifest.json cache/nyc_geocode.json)" ]; then
            echo "Data không đổi — không commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public manifest.json REPORT.md cache/nyc_geocode.json
          git commit -m "data: weekly update $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true   # giữ public/.nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
